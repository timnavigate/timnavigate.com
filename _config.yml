encoding: "utf-8"
markdown: kramdown
highlighter: rouge
#theme: minima

#liquid:
#  error_mode: warn

sass:
  style: :compressed

#webrick:
#  headers:
#    My-Header: My-Value
#    My-Other-Header: My-Other-Value

#plugins:
#  - jekyll-sitemap
#  - jekyll-feed
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

#exclude:
#  - Gemfile
#  - Gemfile.lock
include             : [".htaccess"]
exclude             : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"]
keep_files          : [".git", ".svn"]

#port: 4000
#host: 127.0.0.1
baseurl: ""

permalink: date
#paginate_path: /page:num
#timezone: null

kramdown:
  input: GFM

collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"